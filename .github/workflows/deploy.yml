name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never interrupt an in-flight migration or single-machine deploy.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not set."
            exit 1
          fi
          npm run db:migrate

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN repository secret is not set."
            exit 1
          fi
          flyctl deploy --remote-only --ha=false
